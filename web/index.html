<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-114</title>
<link rel="icon" href="k114.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b0f0c; color: #c8d0b0; }
  #term { position: absolute; inset: 0; padding: 4px; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font: 15px Menlo, "DejaVu Sans Mono", monospace; white-space: pre-line; text-align: center; }
  #status.done { display: none; }
</style>
</head>
<body>
<div id="term"></div>
<div id="status">K-114
laddar …</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.29.5/full/pyodide.js"></script>
<script>
const TEXTUAL = "textual==8.2.8";

// Ljudet: Python (web_audio.WebOut) fyller på en kö i förväg, och den här processorn spelar
// den i Web Audios ljudtråd. Stereo sammanflätat; tom kö ger tystnad.
const WORKLET = `
class K114Out extends AudioWorkletProcessor {
  constructor() {
    super();
    this.q = []; this.pos = 0;
    this.port.onmessage = (e) => {
      if (e.data === "clear") { this.q = []; this.pos = 0; return; }
      this.q.push(e.data);
      if (this.q.length > 64) { this.q.shift(); this.pos = 0; }   // högst ~3 s i kö
    };
  }
  process(_in, outputs) {
    const l = outputs[0][0], r = outputs[0][1] || outputs[0][0];
    let i = 0;
    while (i < l.length && this.q.length) {
      const b = this.q[0];
      while (i < l.length && this.pos < b.length) {
        l[i] = b[this.pos]; r[i] = b[this.pos + 1]; this.pos += 2; i++;
      }
      if (this.pos >= b.length) { this.q.shift(); this.pos = 0; }
    }
    for (; i < l.length; i++) { l[i] = 0; r[i] = 0; }
    return true;
  }
}
registerProcessor("k114-out", K114Out);`;

// Talet: webbläsarens talsyntes. Spelets röster (Alva, Milena) om de finns, annars en annan
// röst på språket. Chrome laddar rösterna efter sidan: vänta på dem en kort stund.
const VOICE_NAMES = { sv: "Alva", ru: "Milena" };
const LANGS = { sv: "sv-SE", ru: "ru-RU" };

async function makeSpeech() {
  const syn = window.speechSynthesis;
  if (!syn || !window.SpeechSynthesisUtterance) return null;
  if (!syn.getVoices().length) {
    await new Promise((ok) => { syn.addEventListener("voiceschanged", ok, { once: true }); setTimeout(ok, 1500); });
  }
  const pick = (lang) => {
    const all = syn.getVoices().filter((v) => v.lang.replace("_", "-").toLowerCase().startsWith(lang));
    return all.find((v) => v.name.startsWith(VOICE_NAMES[lang])) || all.find((v) => v.localService) || all[0] || null;
  };
  const voices = { sv: pick("sv"), ru: pick("ru") };
  const live = new Set();
  return {
    has: (lang) => voices[lang] != null,
    speak: (text, lang, rate) => {
      const handle = { done: false };
      const u = new SpeechSynthesisUtterance(text);
      u.voice = voices[lang]; u.lang = LANGS[lang];
      u.rate = Math.max(0.5, Math.min(2, rate));
      // Chrome kan tappa repliker utan onend (skräpsamlad) och tystna i långa: håll kvar dem,
      // och räkna repliken som slut efter en generös gräns så att besättningen aldrig fastnar.
      const end = () => { handle.done = true; live.delete(u); clearTimeout(guard); };
      const guard = setTimeout(end, (3 + text.length * 0.12 / u.rate) * 1000);
      u.onend = u.onerror = end;
      live.add(u);
      syn.speak(u);
      return handle;
    },
    cancel: () => syn.cancel(),
  };
}

async function makeAudio() {
  // Webbläsaren tillåter ljud först efter en tangent eller ett klick: till dess står klockan still.
  if (!window.AudioWorkletNode) return null;
  const ctx = new AudioContext({ sampleRate: 22050 });
  const url = URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }));
  await ctx.audioWorklet.addModule(url);
  const node = new AudioWorkletNode(ctx, "k114-out", { outputChannelCount: [2] });
  node.connect(ctx.destination);
  const wake = () => { if (ctx.state !== "running") ctx.resume(); };
  for (const t of ["keydown", "pointerdown"]) addEventListener(t, wake, true);
  return {
    rate: ctx.sampleRate,
    time: () => ctx.currentTime,
    push: (buf) => node.port.postMessage(buf, [buf.buffer]),
    clear: () => node.port.postMessage("clear"),
  };
}
const status = document.getElementById("status");
const say = (s) => { status.textContent = "K-114\n" + s; };

async function start() {
  const params = new URLSearchParams(location.search);
  const term = new Terminal({
    fontFamily: 'Menlo, "DejaVu Sans Mono", "Cascadia Mono", monospace',
    fontSize: 14, cursorBlink: false, allowProposedApi: true,
    theme: { background: "#0b0f0c" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));
  fit.fit();

  say("startar Python …");
  const py = await loadPyodide();
  window.k114py = py;          // för felsökning i konsolen
  say("laddar numpy och Textual …");
  await py.loadPackage(["numpy", "micropip"]);
  await py.pyimport("micropip").install(TEXTUAL);
  say("laddar spelet …");
  const zip = await (await fetch("k114.zip")).arrayBuffer();
  py.unpackArchive(zip, "zip", { extractDir: "/home/pyodide/k114" });
  py.runPython("import sys; sys.path.insert(0, '/home/pyodide/k114')");
  const game = py.pyimport("start");

  term.onData((d) => game.feed(d));
  new ResizeObserver(() => { fit.fit(); game.resize(term.cols, term.rows); })
    .observe(document.getElementById("term"));
  let audio = null, speech = null;
  try { audio = await makeAudio(); } catch (e) { console.warn("inget ljud:", e); }
  try { speech = await makeSpeech(); } catch (e) { console.warn("inget tal:", e); }
  const bridge = {
    audio, speech,
    write: (s) => term.write(s),
    exit: () => { say("Spelet är avslutat. Ladda om sidan för att spela igen."); status.classList.remove("done"); },
  };
  status.classList.add("done");
  term.focus();
  const seed = params.has("seed") ? parseInt(params.get("seed")) : undefined;
  await game.main(bridge, term.cols, term.rows, seed, params.get("scenario") || undefined);
}

start().catch((e) => { console.error(e); say("Kunde inte starta:\n" + e); });
</script>
</body>
</html>
