# Snabba tester vid push till main; alla tester (även --slow: hela spel, statistik över frön) vid
# pull request och när de startas för hand. Ändringar som bara rör dokumentation kör inget.
name: tester

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv har inga flyttande huvudtaggar
        with:
          enable-cache: true
      - name: Installera Python och beroenden
        run: |
          uv python install 3.12
          uv sync --locked
      - name: Snabba tester
        if: github.event_name == 'push'
        run: uv run pytest -q
      - name: Alla tester (även --slow)
        if: github.event_name != 'push'
        run: uv run pytest -q --slow
