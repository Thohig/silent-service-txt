# Webbversionen (web/) till GitHub Pages: spelet körs i webbläsaren med Pyodide och xterm.js.
# Bygget är bara att packa filer (ingen Python-installation behövs utöver den som finns).
# Kräver en gång: Settings › Pages › Source: GitHub Actions.
name: pages

# Körs vid push till main när något som hamnar i webbversionen ändrats (sim/, ui/, web/, ikonerna), och för
# hand (Actions › pages › Run workflow). Bara dokumentation publicerar inget.
on:
  push:
    branches: [main]
    paths:
      - "sim/**"
      - "ui/**"
      - "web/**"
      - "ikon/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Två jobb: paketet laddas upp i byggjobbet och publiceras i ett eget jobb. I ett och samma jobb hittade
  # deploy-pages ibland inte paketet som just laddats upp ("Found 0 artifact(s)", 2026-11-24, två gånger).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Packa webbversionen
        run: python3 web/bygg.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
