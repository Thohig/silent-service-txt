[project]
name = "silent-service-txt"
version = "0.1.0"
description = "Textbaserad ubåtssimulator, sovjetisk atomubåt 1962"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "numpy>=2.0",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
