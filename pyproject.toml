[project]
name = "silent-service-txt"
version = "0.1.0"
description = "Textbaserad ubåtssimulator, sovjetisk atomubåt 1962"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "numpy>=2.0",
    "sounddevice>=0.5.6",
    "pyobjc-framework-cocoa>=13.0 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
fonster = [
    "pywebview>=6.2.1",
    "textual-serve>=1.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n auto"
markers = ["slow: långsamt test (hela spel, statistik över frön), körs bara med --slow"]
